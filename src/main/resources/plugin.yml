name: NexusCore
version: 0.1.0-SNAPSHOT
main: fr.cerclepalace.nexus.NexusCorePlugin
description: Core foundation for the Nexus PvP network
author: Cerclepalace
api-version: '26.2'
commands:
  nexus:
    description: Nexus PvP command interface
    usage: /nexus [duel|ffa|end]
    permission: nexus.use
permissions:
  nexus.use:
    description: Use Nexus player commands
    default: true
