name: P010 Audit Bullrun

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  audit-bullrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Static audit
        run: node tools/bullrun.mjs
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build Nexus Core
        working-directory: server/core
        run: gradle build --no-daemon
